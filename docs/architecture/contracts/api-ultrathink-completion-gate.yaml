openapi: 3.1.0
info:
  title: Ultrathink Completion Gate
  version: 1.1.0
  description: >
    Contract for the Omp completion gate, session answer persistence, and
    the advisory incomplete-plan notice. Tracker completion retires a stale
    staged partial_failure verdict; a proceed answer persists before kickoff
    and survives reload; the incomplete notice is advisory and continues
    under gsd-autonomous autonomy with 0 manual proceed steps. The notice
    contains 0 banned STOP, proceed or confirm strings; the incomplete
    metrics stay visible with 1 warning line. The W3 verification matrix
    (AC-78..AC-81) names the graph id, row count and one unblocking action
    in the advisory, renders no second prompt on unchanged state, stays
    silent on a complete plan, and returns one named failure for a
    malformed or missing plan state.
servers:
  - url: internal://ultrathink-completion-gate
    description: Omp planner host boundary (CompletionGate plus session store)
paths:
  /gate/validate:
    post:
      summary: Revalidate staged artifacts against the current tracker state
      operationId: validateGateArtifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Fresh verdict computed from the current tracker rows, with 0 stale verdicts after completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
      x-nfr-bindings:
        - NFR-P2
  /gate/release:
    get:
      summary: Read release readiness from the current tracker status
      operationId: getGateRelease
      responses:
        '200':
          description: Ready after tracker completion, or not_ready naming the pending row count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
      x-nfr-bindings:
        - NFR-P2
  /session/answer:
    put:
      summary: Persist a proceed answer with the settled answers before kickoff
      operationId: persistSessionAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Persisted answer record with kickedOff true, recorded before kickoff step 1 completes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
      x-nfr-bindings:
        - NFR-S3
    get:
      summary: Restore settled answers and the kickedOff flag after reload
      operationId: getSessionAnswer
      responses:
        '200':
          description: Restored answers with kickedOff true, 0 settled questions re-asked, 0 blocking prompts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
      x-nfr-bindings:
        - NFR-S3
  /gate/advisory:
    get:
      summary: Render the advisory incomplete-plan notice
      operationId: getGateAdvisory
      responses:
        '200':
          description: 1 advisory note naming graph id, pending rows and unblocking action, 0 banned strings, request continues; silent on a complete plan; 1 named failure on malformed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryResponse'
components:
  schemas:
    ValidateRequest:
      type: object
      required: [text, correlationId]
      properties:
        text:
          type: string
          description: Staged uplift XML text to validate against the current tracker rows
        correlationId:
          type: string
    ValidateResponse:
      type: object
      required: [state, pendingRows, staleVerdicts, correlationId]
      properties:
        state:
          type: string
          enum: [ready, partial_failure, failed_or_cancelled]
          description: Fresh verdict state; ready after tracker completion with 0 pending rows
        pendingRows:
          type: integer
          minimum: 0
          description: UTR-02 — current pending tracker row count; 1 keeps not_ready
        problems:
          type: array
          items:
            type: string
          description: Named partial problems, for example tracker rows never confirmed
        staleVerdicts:
          type: integer
          minimum: 0
          description: UTR-01 — stale partial_failure verdicts remaining after revalidation; 0 after completion
        correlationId:
          type: string
    ReleaseResponse:
      type: object
      required: [ok, reason, pendingRows, correlationId]
      properties:
        ok:
          type: boolean
          description: True exactly when the fresh verdict is ready
        reason:
          type: string
          enum: [ready, not_ready, already_released, failed]
        pendingRows:
          type: integer
          minimum: 0
          description: Pending row count named in the not_ready detail when not ready
        detail:
          type: string
          description: not_ready names the pending row count; warnings never suppressed wholesale
        correlationId:
          type: string
    AnswerRequest:
      type: object
      required: [answers, kickedOff, correlationId]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SettledAnswer'
          description: UTR-03 — proceed answer with the settled Q1, Q2, Q3 answers, persisted before kickoff
        kickedOff:
          type: boolean
          description: UTR-03 — true once persisted, before kickoff step 1 completes
        correlationId:
          type: string
    SettledAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: string
          description: Settled clarification id, for example Q1, Q2, Q3
        answer:
          type: string
          description: Settled answer text; 0 secrets, 0 chat-only content after persistence
    AnswerResponse:
      type: object
      required: [answers, kickedOff, persisted, correlationId]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SettledAnswer'
          description: UTR-04 — 3 of 3 settled answers restored after reload
        kickedOff:
          type: boolean
          description: True after reload when the persisted record survived SIGTERM
        persisted:
          type: boolean
          description: True when the persistence ordering record exists before kickoff step 1
        reAsked:
          type: integer
          minimum: 0
          description: UTR-04 — 0 settled questions re-asked after reload
        correlationId:
          type: string
    AdvisoryResponse:
      type: object
      required: [note, pendingRows, continues, warningLines, correlationId]
      properties:
        note:
          type: string
          description: UTR-05 — 1 advisory note naming the pending count with 0 banned STOP, proceed or confirm strings
        pendingRows:
          type: integer
          minimum: 0
          description: UTR-06 — incomplete metrics stay visible
        continues:
          type: boolean
          description: UTR-05 — true; the request continues with 0 manual proceed steps
        warningLines:
          type: integer
          minimum: 0
          description: UTR-06 — 1 warning line with 0 warnings suppressed wholesale
        correlationId:
          type: string
        graphId:
          type: string
          description: AC-79 — tracker graph id named in the advisory; empty when no graph applies
        unblockingAction:
          type: string
          description: AC-79 — one unblocking action named in the advisory
        renderCount:
          type: integer
          minimum: 0
          description: AC-80 — advisory renders so far on unchanged state; stays 1 across polls
        failure:
          type: object
          description: AC-81 — named failure for malformed or missing plan state
          required: [code, detail]
          properties:
            code:
              type: string
              description: Named failure code, never silently dropped
            detail:
              type: string
              description: Human-readable detail naming the missing or malformed state
