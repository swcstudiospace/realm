name: Mutation

# Owner decision D6 (2026-10-29): the scheduled mutation workflow is in the signed-off set.
# Stryker was not installed (D-1308 fallback): research recorded a 188-package tree and an
# unproven fit with node:test on compiled output. Survivors are reported, never a failure.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Every job runs on the Omega CI runner pool, never on GitHub-hosted runners
# (swcstudiospace/Omega-Prime docs/ci-runners.md).
jobs:
  mutation:
    name: Mutation
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Run mutation
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/mutation/run.mjs --report mutation-report.json

      - name: Upload mutation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: ignore
