name: Rollback

# Manual only. Marks a published release as a prerelease and dispatches Pages for the default branch, so the
# documentation is rebuilt from the branch and not left pointing at the rolled-back release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mark as a prerelease, for example v0.3.4
        required: true
        type: string

# No workflow-wide grant: the job declares exactly what its steps call.
permissions: {}

concurrency:
  group: rollback
  cancel-in-progress: false

# Every job runs on the Omega CI runner pool, never on GitHub-hosted runners
# (swcstudiospace/Omega-Prime docs/ci-runners.md).
jobs:
  rollback:
    name: Mark release as prerelease
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 10
    permissions:
      contents: write # gh release edit
      actions: write # gh workflow run: GITHUB_TOKEN may dispatch pages.yml only with actions: write
    steps:
      # The tag is passed through the environment and checked before any command uses it.
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag input must match v<major>.<minor>.<patch>." >&2
            exit 1
          fi

      - name: Mark release as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --prerelease

      - name: Dispatch Pages for the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref "${DEFAULT_BRANCH}"
