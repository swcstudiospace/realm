name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Every job runs on the Omega CI runner pool, never on GitHub-hosted runners
# (swcstudiospace/Omega-Prime docs/ci-runners.md).
jobs:
  build:
    name: Build site
    runs-on: [self-hosted, linux, x64, omega-ci]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Generate site content
        run: |
          set -euo pipefail
          node scripts/docs/sync-site.mjs

      - name: Install site dependencies
        run: |
          set -euo pipefail
          npm ci --prefix site

      - name: Build site
        run: |
          set -euo pipefail
          npm run build --prefix site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: [self-hosted, linux, x64, omega-ci]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
